[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embargo-screen"
version = "0.2.0"
description = "Deterministic MNPI screening with model-assisted fact resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
]

[project.scripts]
embargo = "embargo.cli:main"

[tool.setuptools]
packages = ["embargo", "eval"]
