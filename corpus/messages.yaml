# V0 eval corpus messages (spec §8). M001-M010 are the nine required hard
# cases from §8.1 (M004/M005 together are the "before and after cleared_at"
# case). M011-M023 are padding for coverage breadth across verdict/state
# combinations. M024-M030 are additional variety and contrast cases.
# expected_fact_ids is the ground truth of facts truly CONVEYED (not merely
# mentioned) — used for resolver precision/recall, independent of the
# ledger-driven expected_verdict.

# --- hard cases (spec §8.1) --------------------------------------------------

- message_id: M001
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Just a heads up, the Acme news is now public — should be a smooth transition."
  expected_verdict: clean
  expected_fact_ids: [F001]
  # Public info about a name still on a restricted list -> clean (nobody is
  # crossed on F001 at all; it's clean purely because cleared_at has passed).

- message_id: M002
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Following up on the thing we discussed last week about the restructuring situation — still moving forward."
  expected_verdict: violation_disclosure
  expected_fact_ids: [F002]
  # Fact referenced via euphemism, no entity named -> candidate reaches the
  # resolver only via alice's wall-crossing (prefilter set 2), not a keyword hit.

- message_id: M003
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Congrats to the whole Delta team on the big product launch celebration!"
  expected_verdict: clean
  expected_fact_ids: []
  # Chatty message naming a restricted entity, disclosing nothing -> clean via mentions.

- message_id: M004
  sender: alice
  recipients: [bob]
  timestamp: "2026-02-01T00:00:00"
  body: "The Epsilon settlement details are still confidential, keep this between us."
  expected_verdict: violation_disclosure
  expected_fact_ids: [F004]
  # Same fact referenced before cleared_at -> violation.

- message_id: M005
  sender: alice
  recipients: [bob]
  timestamp: "2026-04-01T00:00:00"
  body: "The Epsilon settlement details are now old news."
  expected_verdict: clean
  expected_fact_ids: [F004]
  # ...and after cleared_at -> clean. Same fact, same parties, different timestamp.

- message_id: M006
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Wanted to give you an early look at the Zeta board situation before it's official."
  expected_verdict: violation_disclosure
  expected_fact_ids: [F005]
  # Recipient wall-crossed only from 2026-06-15, after this message -> violation.

- message_id: M007
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Wanted to loop you in on both the Eta joint venture and the Theta situation — let me know your thoughts."
  expected_verdict: violation_upstream_leak
  expected_fact_ids: [F006, F007]
  # One message, two facts in different states: Eta is immaterial (clean),
  # Theta's sender is unauthorized (violation_upstream_leak) -> most severe wins.

- message_id: M008
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Still can't believe how close the Iota deal came before it fell apart."
  expected_verdict: violation_disclosure
  expected_fact_ids: [F008]
  # Abandoned deal referenced after it fell through -> violation (recipient uncrossed).

- message_id: M009
  sender: alice
  recipients: [bob]
  timestamp: "2026-06-01T00:00:00"
  body: "Heads up on the Kappa talks — very early stage but promising."
  expected_verdict: violation_upstream_leak
  expected_fact_ids: [F009]
  # Sender not wall-crossed -> violation_upstream_leak, regardless of recipient status.

- message_id: M010
  sender: alice
  recipients: [bob]
  timestamp: "2026-02-01T00:00:00"
  body: "The Lambda spinoff is public knowledge now but we're still finalizing internal details."
  expected_verdict: violation_disclosure
  expected_fact_ids: [F010]
  # Conveyed after announced_at but before cleared_at -> violation (recipient uncrossed).

